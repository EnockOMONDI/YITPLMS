services:
  # Django Web Service - Entrepreneurship LMS
  - type: web
    name: entrepreneurship-lms
    runtime: python
    plan: free
    buildFilter:
      paths:
      - build.sh
      - requirements.txt
      - runtime.txt
    buildCommand: ./build.sh
    startCommand: gunicorn entrepreneurship_lms.wsgi:application
    healthCheckPath: /health/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: false
      - key: DJANGO_SETTINGS_MODULE
        value: entrepreneurship_lms.settings
      - key: ALLOWED_HOSTS
        value:  "*"
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_nHl0UNigTdm4@ep-frosty-brook-a8iocmrc-pooler.eastus2.azure.neon.tech/neondb?sslmode=require
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: CORS_ALLOWED_ORIGINS
        value: https://entrepreneurship-lms.onrender.com,http://127.0.0.1:8000,http://localhost:8000
      - key: SECURE_SSL_REDIRECT
        value: false
      - key: PYTHONUNBUFFERED
        value: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: ADMIN_EMAIL
        value: admin@entrepreneurship-lms.com
      - key: ADMIN_USERNAME
        value: lmsadmin
      - key: ADMIN_PASSWORD
        value: LMSAdmin2024!
    disk:
      name: entrepreneurship-lms-disk
      mountPath: /opt/render/project/src/media
      sizeGB: 1

